name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || {
            echo "::error::not gofmt-clean:"; echo "$unformatted"
            gofmt -d $unformatted; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Assert 100% statement coverage
        run: |
          go tool cover -func=coverage.out
          below=$(go tool cover -func=coverage.out | awk '$NF != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100% on:"
            echo "$below"
            exit 1
          fi

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
